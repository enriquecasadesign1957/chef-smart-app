name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Static export: NEXT_PUBLIC_* se hornean en build (keys publishable = públicas por diseño)
      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://aknloedykengemrlehyp.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_59J7cb_oNSVg2xBeSYhXFA_9IgL1naX
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_59J7cb_oNSVg2xBeSYhXFA_9IgL1naX
          NEXT_PUBLIC_MENU_API_URL: https://mi-menu-smart-api.enriquecasadesign.workers.dev
        run: npm run build

      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.26.0"
          command: pages project create mi-menu-smart --production-branch=main

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.26.0"
          command: pages deploy out --project-name=mi-menu-smart --commit-dirty=true
